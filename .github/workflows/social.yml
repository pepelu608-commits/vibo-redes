# Publicador de VIBO en redes, cada 2 horas, desde un repositorio PÚBLICO
# (22 sep 2026): en repos públicos los minutos de GitHub Actions no cuentan
# contra la cuota, así que publica aunque el Mac esté apagado.
# Publica de verdad SOLO si la variable de repositorio SOCIAL_APPLY es "true".
name: social
on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: social
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Calendario con el bote real
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/social/build-schedule.ts --sabado ${{ vars.SABADO_PARTIDA }} --calentamiento ${{ vars.CALENTAMIENTO_DIAS || 16 }}
        continue-on-error: true
      - name: Publicar lo que toca
        env:
          SOCIAL_CUENTAS_CALIENTES: ${{ vars.SOCIAL_CUENTAS_CALIENTES }}
          SOCIAL_MANUAL_REDES: ${{ vars.SOCIAL_MANUAL_REDES }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          X_REFRESH_TOKEN: ${{ secrets.X_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          BUFFER_TOKEN_EN: ${{ secrets.BUFFER_TOKEN_EN }}
          BUFFER_TOKEN_EXTRA: ${{ secrets.BUFFER_TOKEN_EXTRA }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/social/publicar-directo.ts ${{ vars.SOCIAL_APPLY == 'true' && '--apply' || '' }}
      - name: Guardar el registro de lo publicado
        if: ${{ vars.SOCIAL_APPLY == 'true' }}
        run: |
          git config user.name "vibo-social"
          git config user.email "social@vibo.invalid"
          git add -A scripts/social/publicados.json scripts/social/schedule.csv
          git diff --cached --quiet || (git commit -m "social: registro de publicaciones" && git push)
