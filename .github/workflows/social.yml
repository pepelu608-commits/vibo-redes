# Publicador de VIBO en redes, cada 2 horas, desde un repositorio PÚBLICO
# (22 sep 2026): en repos públicos los minutos de GitHub Actions no cuentan
# contra la cuota, así que publica aunque el Mac esté apagado.
# Publica de verdad SOLO si la variable de repositorio SOCIAL_APPLY es "true".
name: social
on:
  schedule:
    # Cada hora (25 sep 2026): GitHub se salta muchas ejecuciones programadas;
    # con más intentos y --adelantar=8, no se pierde nada. Lo ya programado no se repite.
    - cron: "17 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
  # 24 sep 2026: SIN llave maestra de la base de datos en este repositorio
  # público. Para subir un vídeo, el robot pide a GitHub su firma (id-token)
  # y VIBO le da permiso para subir solo ese vídeo (/api/redes/subida). Los
  # datos que usa (bote, partida terminada) los lee de /api/redes/datos.
  id-token: write
concurrency:
  group: social
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Domingo a las 08 UTC (10:00 en Madrid): el resumen y la repetición de
      # la partida del sábado, con datos reales (24 sep 2026). Se guardan en el
      # repo para que los encuentren las publicaciones de las 12, 16, 19 y 20 h.
      # Sin partida en las últimas 36 h (o con menos de 20 inscritos) no se
      # fabrica nada y esas publicaciones se saltan solas.
      - name: Fabricar resumen y repetición del sábado (domingos 08 UTC)
        if: ${{ vars.SOCIAL_APPLY == 'true' }}
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          if [ "$(date -u +%u)" = "7" ] && [ "$(date -u +%H)" = "08" ]; then
            npx tsx scripts/social/resumen-partida.ts --grabar || echo "resumen: no se pudo"
            npx tsx scripts/social/repeticion-partida.ts --grabar || echo "repetición: no se pudo"
            git config user.name "vibo-social"
            git config user.email "social@vibo.invalid"
            git add -A social/videos
            git diff --cached --quiet || (git commit -m "social: resumen y repetición del sábado" && git pull --rebase -q origin main && git push)
          else
            echo "No toca (solo domingos a las 08 UTC)."
          fi
        continue-on-error: true
      - name: Calendario con el bote real
        run: npx tsx scripts/social/build-schedule.ts --sabado ${{ vars.SABADO_PARTIDA }} --calentamiento ${{ vars.CALENTAMIENTO_DIAS || 16 }}
        continue-on-error: true
      - name: Publicar lo que toca
        env:
          SOCIAL_CUENTAS_CALIENTES: ${{ vars.SOCIAL_CUENTAS_CALIENTES }}
          SOCIAL_MANUAL_REDES: ${{ vars.SOCIAL_MANUAL_REDES }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_EN: ${{ secrets.YT_REFRESH_TOKEN_EN }}
          X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
          X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
          X_REFRESH_TOKEN: ${{ secrets.X_REFRESH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          BUFFER_TOKEN: ${{ secrets.BUFFER_TOKEN }}
          BUFFER_TOKEN_EN: ${{ secrets.BUFFER_TOKEN_EN }}
          BUFFER_TOKEN_EXTRA: ${{ secrets.BUFFER_TOKEN_EXTRA }}
        # --adelantar=8 (25 sep 2026): GitHub se salta ejecuciones (huecos de 5-7 h
        # el 24 sep) y lo que pasaba de hora se perdía. Cada pasada deja
        # programado lo de las próximas 8 h en Buffer y en YouTube (publishAt).
        run: npx tsx scripts/social/publicar-directo.ts ${{ vars.SOCIAL_APPLY == 'true' && '--apply' || '' }} --adelantar=8
      - name: Guardar el registro de lo publicado
        if: ${{ vars.SOCIAL_APPLY == 'true' }}
        run: |
          git config user.name "vibo-social"
          git config user.email "social@vibo.invalid"
          git add -A scripts/social/publicados.json scripts/social/schedule.csv
          git diff --cached --quiet || (git commit -m "social: registro de publicaciones" && git push)
